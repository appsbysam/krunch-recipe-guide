<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101113"><title>KRUNCH Recipes</title><style>body{margin:0;background:#101113;color:#f5f2ed;font:17px Arial}main{max-width:1050px;margin:auto;padding:25px}header{padding:22px;background:#191a1d;border-bottom:1px solid #383838}h1{margin:0;font-size:36px;letter-spacing:2px}small{color:#c9ab79}button,input,textarea,select{font:inherit;border-radius:12px;padding:15px}button{border:1px solid #484848;background:#252629;color:white;cursor:pointer}button:hover{border-color:#c9ab79}input,textarea,select{background:#252629;color:white;border:1px solid #555;box-sizing:border-box;width:100%}.gold{background:#c9ab79;color:#111;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.tile{min-height:175px;text-align:left;font-size:23px;background:linear-gradient(145deg,#343434,#202023)}.tile span{display:block;font-size:48px}.list{display:grid;gap:12px}.item{text-align:left}.panel{background:#1e1f22;border-radius:15px;padding:20px;margin:15px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#bbb}.hidden{display:none}#login{max-width:420px;margin:10vh auto;padding:28px;background:#202124;border-radius:20px}#login input{margin:7px 0}.ingredients{display:grid;grid-template-columns:1fr auto;gap:14px}label{display:block;margin:14px 0}@media(max-width:600px){.tile{min-height:145px;font-size:18px}.tile span{font-size:32px}h1{font-size:26px}} .admin-entry{display:flex;gap:10px;align-items:center;background:#1e1f22;padding:10px;border-radius:12px}.admin-entry .edit-btn{flex:1;text-align:left}.danger{background:#7d2929;color:white;border-color:#a74a4a;font-weight:bold}.versionbar{position:relative;text-align:center;padding:18px;color:#c9ab79;font-size:13px}.versionbar button{font-size:13px;padding:8px}.modalshade{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}.modalshade.hidden{display:none}.modalbox{background:#222326;border:1px solid #b99a67;border-radius:18px;padding:24px;width:min(440px,100%);box-sizing:border-box;box-shadow:0 12px 55px #000}.modalbox h2{margin-top:0}.modalbox li{margin:10px 0}.modalbox button{margin:5px} </style><div id="login"><h1>KRUNCH <small>CAFÉ</small></h1><h2>Staff Recipe Guide</h2><p>Sign in on the café tablet.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="gold" id="signin">Sign in</button><p id="error"></p></div><div id="app" class="hidden"><header><div class="row"><h1>KRUNCH <small>CAFÉ</small></h1><div><button id="manage" class="hidden">Manage</button><button id="signout">Sign out</button></div></div></header><main><section id="home"><h2>Recipe Guide</h2><input id="search" placeholder="Search recipes or ingredients"><div id="categories" class="grid" style="margin-top:20px"></div><div id="results" class="list"></div></section><section id="listing" class="hidden"><button id="backhome">← Categories</button><h2 id="catname"></h2><div id="items" class="list"></div></section><section id="detail" class="hidden"><button id="backlist">← Back</button><h2 id="title"></h2><p id="description" class="muted"></p><div class="panel"><h3>Ingredients</h3><div id="ingredients" class="ingredients"></div></div><div class="panel"><h3>Method</h3><ol id="method"></ol></div><p class="muted">Sample recipes: verify all ingredients, measurements and allergens before use.</p></section><section id="admin" class="hidden"><button id="backadmin">← Back</button><h2>Manage Recipes</h2><h3>Existing recipes — tap Edit to change one</h3><div id="adminlist" class="list"></div><label>Editing recipe<select id="choice"></select></label><label>Name<input id="name"></label><label>Description<input id="desc"></label><label>Category<select id="category"></select></label><label>Ingredients — one per line: Name | Quantity<textarea id="ings" rows="7"></textarea></label><label>Steps — one per line<textarea id="steps" rows="7"></textarea></label><label><input id="published" type="checkbox" style="width:auto"> Published</label><button class="gold" id="save">Save</button><button id="new">New recipe</button><button id="delete" style="background:#652929" class="hidden">Delete selected recipe</button><p id="status"></p></section></main></div><footer class="versionbar">KRUNCH Recipe Guide · <span id="version">v1.1.0</span> · <button id="whatsnew">What’s New</button> <button id="checkupdate">Check for updates</button></footer><div id="modal" class="modalshade hidden" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><div class="modalbox"><h2 id="modaltitle"></h2><div id="modalbody"></div><div id="modalactions"></div></div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.76.1';const db=createClient('https://cebgyyairqctbgrocxgl.supabase.co','sb_publishable_VFT7GrL1rJtmV0hv0CPrlg_qjZXq4PT');const $=id=>document.getElementById(id);let cats=[],recs=[],admin=false,catId=null,sess=null;const show=id=>['home','listing','detail','admin'].forEach(x=>$(x).classList.toggle('hidden',x!==id));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function btn(r){let b=document.createElement('button');b.className='item';b.textContent=r.name+'  →';b.onclick=()=>openRecipe(r);return b}function home(){show('home');$('categories').replaceChildren(...cats.map(c=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<span>'+esc(c.icon)+'</span>'+esc(c.name)+' →';b.onclick=()=>openCat(c.id);return b}))}function openCat(id){catId=id;$('catname').textContent=cats.find(c=>c.id===id)?.name;$('items').replaceChildren(...recs.filter(r=>r.category_id===id).map(btn));show('listing')}function openRecipe(r){$('title').textContent=r.name;$('description').textContent=r.description;$('ingredients').innerHTML=(r.ingredients||[]).map(i=>'<span>'+esc(i.name)+'</span><b>'+esc(i.quantity)+'</b>').join('');$('method').replaceChildren(...(r.method||[]).map(t=>{let li=document.createElement('li');li.textContent=t;return li}));catId=r.category_id;show('detail')}function editor(){let r=recs.find(r=>r.id===$('choice').value);$('name').value=r?.name||'';$('desc').value=r?.description||'';$('category').value=r?.category_id||cats[0]?.id||'';$('ings').value=(r?.ingredients||[]).map(i=>i.name+' | '+i.quantity).join('\n');$('steps').value=(r?.method||[]).join('\n');$('published').checked=r?.published??false;$('delete').classList.toggle('hidden',!r);$('status').textContent=r?'Editing: '+r.name:'Creating a new recipe'}async function load(){let[c,r,a]=await Promise.all([db.from('krunch_categories').select('*').order('sort_order'),db.from('krunch_recipes').select('*').order('name'),db.from('krunch_admins').select('user_id').eq('user_id',sess.user.id).maybeSingle()]);if(c.error||r.error)throw Error(c.error?.message||r.error?.message);cats=c.data;recs=r.data;admin=!!a.data;$('manage').classList.toggle('hidden',!admin);$('category').innerHTML=cats.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('choice').innerHTML='<option value="">New recipe</option>'+recs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('adminlist').replaceChildren(...recs.map(x=>{let row=document.createElement('div');row.className='admin-entry';let b=document.createElement('button');b.textContent='✎ Edit: '+x.name;b.className='edit-btn';b.onclick=()=>{$('choice').value=x.id;editor();$('name').scrollIntoView({behavior:'smooth',block:'center'})};let d=document.createElement('button');d.textContent='Delete';d.className='danger';d.setAttribute('aria-label','Delete '+x.name);d.onclick=()=>deleteRecipe(x.id);row.append(b,d);return row}));editor();home()}async function start(){sess=(await db.auth.getSession()).data.session;$('login').classList.toggle('hidden',!!sess);$('app').classList.toggle('hidden',!sess);if(sess)try{await load()}catch(e){$('error').textContent=e.message;alert(e.message)}}$('signin').onclick=async()=>{let{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('error').textContent=error?.message||'';if(!error)start()};$('signout').onclick=async()=>{await db.auth.signOut();start()};$('backhome').onclick=home;$('backlist').onclick=()=>openCat(catId);$('backadmin').onclick=home;$('manage').onclick=()=>show('admin');$('choice').onchange=editor;$('new').onclick=()=>{$('choice').value='';editor();$('name').focus()};async function deleteRecipe(id){if(!admin)return;let recipe=recs.find(x=>x.id===id);if(!recipe)return;if(!confirm('Permanently delete "'+recipe.name+'"? This cannot be undone.'))return;let{error}=await db.from('krunch_recipes').delete().eq('id',id);if(error){$('status').textContent='Delete failed: '+error.message;return}await load();show('admin');$('status').textContent='Deleted: '+recipe.name} $('delete').onclick=()=>deleteRecipe($('choice').value);$('search').oninput=()=>{let q=$('search').value.toLowerCase().trim();$('categories').classList.toggle('hidden',!!q);$('results').replaceChildren(...(q?recs.filter(r=>(r.name+' '+r.description+' '+(r.ingredients||[]).map(i=>i.name).join(' ')).toLowerCase().includes(q)):[]).map(btn))};$('save').onclick=async()=>{if(!admin)return;let id=$('choice').value,p={name:$('name').value.trim(),description:$('desc').value,category_id:$('category').value,ingredients:$('ings').value.split('\n').filter(Boolean).map(s=>{let[n,...v]=s.split('|');return{name:n.trim(),quantity:v.join('|').trim()}}),method:$('steps').value.split('\n').map(s=>s.trim()).filter(Boolean),published:$('published').checked};if(!p.name)return $('status').textContent='Name required';let{error}=await(id?db.from('krunch_recipes').update(p).eq('id',id):db.from('krunch_recipes').insert(p));$('status').textContent=error?.message||'Saved';if(!error){await load();show('admin');if(id){$('choice').value=id;editor()}$('status').textContent='Recipe saved successfully'}};const APP_VERSION='1.1.0';const NOTES=['Delete buttons now appear beside every recipe in Manage.','Edit existing recipes directly from the management list.','Added app version, update notifications and What’s New.'];const SEEN='krunch_seen_version';function modal(title,lines,buttons){$('modaltitle').textContent=title;$('modalbody').replaceChildren(...lines.map(t=>{let p=document.createElement('p');p.textContent=t;return p}));$('modalactions').replaceChildren(...buttons.map(x=>{let b=document.createElement('button');b.textContent=x.label;b.className=x.primary?'gold':'';b.onclick=x.action;return b}));$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function whatsNew(){modal('What’s New · v'+APP_VERSION,NOTES,[{label:'Got it',primary:true,action:()=>{localStorage.setItem(SEEN,APP_VERSION);closeModal()}}])}async function checkUpdate(manual=false){try{let response=await fetch('./version.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Update check failed');let data=await response.json();if(data.version!==APP_VERSION){modal('Update Available · v'+data.version,data.notes||['A new version is ready.'],[{label:'Update now',primary:true,action:()=>{location.replace(location.pathname+'?v='+encodeURIComponent(data.version))}},{label:'Later',action:closeModal}])}else if(manual){modal('You’re up to date',['Version '+APP_VERSION+' is the latest version.'],[{label:'OK',primary:true,action:closeModal}])}}catch(e){if(manual)modal('Unable to check updates',['Please check your internet connection and try again.'],[{label:'OK',action:closeModal}])}}$('whatsnew').onclick=whatsNew;$('checkupdate').onclick=()=>checkUpdate(true);if(localStorage.getItem(SEEN)!==APP_VERSION)whatsNew();checkUpdate();document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});start();</script></html>
